<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🛒 Your Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            background: #f7f9fc;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        .cart-container {
            width: 80%;
            margin: 40px auto;
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .cart-item img {
            width: 80px;
            border-radius: 8px;
        }

        .cart-item p {
            font-size: 18px;
            margin: 0;
            flex: 1;
        }

        .price {
            color: #007bff;
            font-weight: bold;
        }

        .btn-home {
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-home:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>🛒 Your Shopping Cart</h1>

    <div class="cart-container">
        <p>No items added yet 😅</p>
    </div>

    <button class="btn-home" onclick="window.location.href='/'">⬅ Back to Shop</button>
</body>
</html>
